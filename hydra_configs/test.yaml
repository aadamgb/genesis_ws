defaults:
  - drone: general_evader   # the tasks override it, it must come before task
  - task: evader
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled        
  - _self_

e: drone-hovering
c: 300
t: 20
record: false
export: false
     
log_dir: logs/evader/SRT_general_no_name  # the run to test

hydra:
  run:
    dir: ${log_dir}
  job:
    chdir: false       
  output_subdir: null   
