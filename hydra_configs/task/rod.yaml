name: rod

env:
  num_actions: 8   # [drone 0, drone 1] motor commands
  dt: 0.008        # [s] as goto, rl_goto at 125 Hz
  substeps: 4      # the ropes need more than goto's 2
  controller_type: ${cm}

 # each drone samples its own
  drone: ${drone}
  domain_rand:
    enabled: true
    physical_resample: startup
    action_delay:  # [s] the gazebo/PX4 loop measured 14–20 ms
      nominal: 0.018
      range: [0.01, 0.026]
    hover_estimate_noise: 0.05

  rod:
    length: 1.1        # [m]
    radius: 0.01       # [m]
    mass: 0.1          # [kg]
    drone_spacing: 1.0 # [m] between the drones, the rope tips are welded 5 cm from the rod ends
    hang: 0.08         # [m] rod below the drones, the rope length
    tip_link: segment_5_cylinder

  spawn_height: 1.5    # [m] drones

  # initial state of the whole formation, half-ranges (world frame)
  init_pos_offset: [0.5, 0.5, 0.2]  # [m]
  init_lin_vel: 0.3                 # [m/s] per axis

  termination_if_tilt_greater_than: 60       # [deg] roll or pitch of a drone
  termination_if_close_to_ground: 0.1        # [m] a drone
  termination_if_xy_greater_than: 3.0        # [m] rod center from the target
  termination_if_z_greater_than: 3.0
  termination_if_drones_closer_than: 0.5     # [m]
  episode_length_s: 15.0
  at_target_threshold: 0.1
  clip_actions: 1.0
  visualize_target: ${v}
  visualize_camera: false
  max_visualize_FPS: 60

obs:
  obs_scales:
    rel_pos: 0.3333333333333333
    lin_vel: 0.3333333333333333
    ang_vel: 0.31831015504887655
  obs_noise:
    rel_pos: 0.02   # [m]
    quat: 0.01
    lin_vel: 0.05   # [m/s]
    ang_vel: 0.1    # [rad/s]

reward:
  reward_scales:
    target: 10.0     # progress of the rod center
    smooth: -0.005
    angular: -0.008
    crash: -10.0

command:
  num_commands: 3
  pos_x_range: [-1.0, 1.0]
  pos_y_range: [-1.0, 1.0]
  pos_z_range: [1.0, 1.0]

rsl_rl:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.004
    gamma: 0.99
    lam: 0.95
    learning_rate: 0.0003
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: fixed   # the adaptive schedule sat at its 1e-2 cap in the adapt_goto runs
    use_clipped_value_loss: true
    value_loss_coef: 1.0
  actor:
    class_name: MLPModel
    hidden_dims: [256, 256]
    activation: tanh
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_type: scalar
  critic:
    class_name: MLPModel
    hidden_dims: [256, 256]
    activation: tanh
  obs_groups:
    actor: [policy]
    critic: [policy]
  num_steps_per_env: 100
  save_interval: 100
  run_name: ${e}
  logger: tensorboard
