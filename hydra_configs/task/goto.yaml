name: goto

env:
  num_actions: 4
  dt: 0.008
  controller_type: ${cm}
  termination_if_roll_greater_than: 60
  termination_if_pitch_greater_than: 60
  termination_if_close_to_ground: 0.1
  termination_if_x_greater_than: 3.0
  termination_if_y_greater_than: 3.0
  termination_if_z_greater_than: 3.0
  base_init_pos: [0.0, 0.0, 1.0]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length_s: 15.0
  at_target_threshold: 0.2
  # resampling_time_s: 3.0
  drone: ${drone}
  domain_rand:
    enabled: true
    physical_resample: startup   # mass / inertia / arm sampled once per env (free) or at every reset (~2 ms/step)
    action_delay:  # [s] the gazebo/PX4 loop measured 14–20 ms
      nominal: 0.018
      range: [0.01, 0.026]
    # SRTHover hover command per env from the sampled mass and kf, times 1 +- this every episode (the
    # PX4 hover thrust estimate); remove it for the nominal hover
    hover_estimate_noise: 0.05

  # initial state randomization, half-ranges: RLGoto takes over mid-climb (~0.3 m/s) and the
  # PX4 heading estimate is off by a few degrees
  init_lin_vel: 0.5   # [m/s] per axis
  init_ang_vel: 1.0   # [rad/s] per axis
  init_tilt: 15.0     # [deg] roll and pitch
  init_yaw: 30.0      # [deg]
  clip_actions: 1.0
  visualize_target: ${v}
  visualize_camera: false
  max_visualize_FPS: 60

obs:
  history: 4
  obs_scales:
    rel_pos: 0.3333333333333333
    lin_vel: 0.3333333333333333
    ang_vel:  0.31831015504887655 
  obs_noise:
    rel_pos: 0.02   # [m]
    quat: 0.01
    lin_vel: 0.05   # [m/s]
    ang_vel: 0.1    # [rad/s]

reward:
  reward_scales:
    target: 10.0
    smooth: -0.005
    angular: -0.008
    crash: -10.0

command:
  num_commands: 3
  pos_x_range: [-1.0, 1.0]
  pos_y_range: [-1.0, 1.0]
  pos_z_range: [1.0, 1.0]

rsl_rl:
  algorithm:
    class_name: PPO
    clip_param: 0.2
    desired_kl: 0.01
    entropy_coef: 0.004
    gamma: 0.999
    lam: 0.95
    learning_rate: 0.0003
    max_grad_norm: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    use_clipped_value_loss: true
    value_loss_coef: 1.0
  actor:
    class_name: MLPModel
    hidden_dims: [128, 128]
    activation: tanh
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_type: scalar
  critic:
    class_name: MLPModel
    hidden_dims: [128, 128]
    activation: tanh
  obs_groups:
    actor: [policy]
    critic: [policy]
  num_steps_per_env: 100
  save_interval: 100
  run_name: ${e}
  logger: tensorboard

log_dir: logs/${e}
