# x500 nominal parameters and domain randomization ranges (utils/domain_rand.py), from the MRS Gazebo model
# x500.sdf.jinja. Each entry has a nominal and optionally range: [lo, hi] (absolute) or scale: [lo, hi]
# (x nominal); without either the nominal is used. The nominals are written into Genesis when the scene is
# built, over the values of the urdf.
name: x500
urdf: utils/models/urdf/x500.urdf
propellers_spin: [-1, -1, 1, 1]

mass:          # [kg] 1.94 kg body + 4 x 0.01608 kg props
  nominal: 2.0043
  scale: [0.9, 1.1]
inertia:       # [kg m^2] Jxx, Jyy, Jzz in the body frame, body cylinder + props
  nominal: [0.03353, 0.03353, 0.06583]
  scale: [0.8, 1.2]
arm:           # [m] rotor distance from the COM, prop_xy_offset 0.1812 * sqrt(2)
  nominal: 0.2563
  # scale: [0.95, 1.05]
kf:            # [N/rpm^2] F = kf rpm^2, motor_constant 4.2e-5 N/(rad/s)^2 * (2 pi / 60)^2
  nominal: 4.605815e-7
  scale: [0.85, 1.1]
km:            # [Nm/rpm^2] M = km rpm^2, moment_constant 0.06 m * kf, follows the sampled kf (applied through the rpm)
  nominal: 2.763489e-8
max_rpm: 7448.451  # [rpm] max_rot_velocity 780 rad/s
motor_tau:     # [s] first-order lag on rpm, time_constant_up/down
  up: 0.0125
  down: 0.025
  scale: [0.8, 1.25]
motor_eff:     # [-] per motor, multiplies its rpm command
  nominal: 1.0
  range: [0.95, 1.0]
